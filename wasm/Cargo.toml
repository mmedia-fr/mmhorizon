[package]
name = "mmhorizon_wasm"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false
description = "Noyau de calcul de MMhorizon compilé en WebAssembly, pour une page web"

[lib]
# cdylib : le module WebAssembly ; rlib : les tests natifs.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Le calcul lui-même, celui de l'application et de l'outil en ligne de commande.
mmhorizon_noyau = { path = "../noyau" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Version exacte : l'outil wasm-bindgen qui écrit la liaison JavaScript doit être
# de la même version (intégration continue : cargo install wasm-bindgen-cli).
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# Panoramas de synthèse encodés en PNG, comme une page les transmettrait.
image = { version = "0.25", default-features = false, features = ["png"] }

# Un panorama de 35 Mpx se décode dans le navigateur : la vitesse prime sur la taille.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
