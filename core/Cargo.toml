[package]
name = "mmhorizon_core"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
# Le calcul lui-même : sans Qt, partagé avec l'outil en ligne de commande.
mmhorizon_noyau = { path = "../noyau" }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

# Le décodage d'un panorama de 25 Mpx est lent sans optimisation, même en
# construction de mise au point.
[profile.dev.package."*"]
opt-level = 3
